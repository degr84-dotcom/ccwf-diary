<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCWF Civil Works — Site Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F2F0EB;
  --surface:#FFFFFF;
  --border:#DDD9D0;
  --border-light:#EAE7E0;
  --green:#1F5C2E;
  --green-mid:#2E7D3E;
  --green-light:#E8F3EA;
  --green-accent:#3A9B50;
  --amber:#7B5E00;
  --amber-bg:#FFF8E1;
  --amber-border:#FFD54F;
  --red:#C0392B;
  --red-bg:#FDECEA;
  --text:#1A1A1A;
  --text-2:#4A4A4A;
  --text-3:#888;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --radius:8px;
  --radius-sm:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
/* Layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--green);padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px}
.sidebar-project{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
.sidebar-nav{padding:16px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.on{color:#fff;background:rgba(255,255,255,.15)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}

.sidebar-action-btn{width:100%;font-size:12px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;text-align:left;transition:all .15s}
.sidebar-action-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.sidebar-date{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.4)}
.main{padding:32px 40px;overflow-y:auto}
/* Cards */
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-3);margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
/* Weather */
.wx-row{display:flex;gap:8px;flex-wrap:wrap}
.wx-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:none;cursor:pointer;font-size:13px;font-family:'Barlow',sans-serif;color:var(--text-2);transition:all .15s;font-weight:500}
.wx-btn:hover{border-color:var(--green-mid);color:var(--green)}
.wx-btn.on{border-color:var(--green-mid);background:var(--green-light);color:var(--green)}
.wx-icon{font-size:16px}
/* Plant/Personnel */
.on-site-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.on-site-empty{font-size:12px;color:var(--text-3);padding:8px 0;font-style:italic}
.on-site-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border-light)}
.on-site-item.plant-type{border-left:3px solid var(--green-accent)}
.on-site-item.pers-type{border-left:3px solid var(--green)}
.on-site-item.dimmed{opacity:.4}
.item-info-name{font-size:13px;font-weight:600;color:var(--text)}
.item-info-rate{font-size:11px;color:var(--text-3);font-family:'DM Mono',monospace;margin-top:2px}
.rm-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--red);background:none;border:1px solid var(--red);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;transition:all .15s}
.rm-btn:hover{background:var(--red-bg)}
.add-row{display:flex;gap:8px}
.add-select{flex:1;font-size:13px;padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Barlow',sans-serif;cursor:pointer}
.add-select:focus{outline:none;border-color:var(--green-mid)}
.add-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap}
.add-btn:hover{background:var(--green);color:#fff}
.add-btn:disabled{opacity:.35;pointer-events:none}
.divider{height:1px;background:var(--border-light);margin:16px 0}
/* Works */
.works-list{display:flex;flex-direction:column;gap:3px}
.work-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;transition:all .12s}
.work-item:hover{background:var(--bg)}
.work-item.sel{border-color:var(--border);background:var(--bg)}
.work-cb{width:18px;height:18px;min-width:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-size:11px;color:#fff}
.work-cb.done{background:var(--green-mid);border-color:var(--green-mid)}
.work-label{font-size:13px;line-height:1.4;flex:1;color:var(--text-2)}
.work-done-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text-3);white-space:nowrap;font-family:'Barlow',sans-serif;font-weight:500;transition:all .15s}
.work-done-btn:hover{border-color:var(--green-mid);color:var(--green)}
.work-done-btn.done{background:var(--green-light);border-color:var(--green-mid);color:var(--green)}
.sec-hdr{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:10px 0 4px;border-top:1px solid var(--border-light);margin-top:4px}
.sec-hdr:first-child{border-top:none;margin-top:0;padding-top:0}
.hint{display:flex;gap:6px;font-size:11px;color:var(--text-3);margin-bottom:12px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);line-height:1.5;border:1px solid var(--border-light)}
/* Inputs */
.text-input{width:100%;font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Barlow',sans-serif;transition:border-color .15s}
.text-input:focus{outline:none;border-color:var(--green-mid)}
textarea.text-input{resize:vertical;min-height:80px}
/* Fuel/SD */
.fuel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fuel-input{width:90px;font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);text-align:right;font-family:'DM Mono',monospace}
.fuel-input:focus{outline:none;border-color:var(--green-mid)}
.fuel-label{font-size:13px;color:var(--text-2);font-weight:500}
.fuel-calc{font-family:'DM Mono',monospace;font-size:13px;color:var(--text-3)}
.sd-row{display:flex;align-items:center;gap:10px;font-size:13px}
.sd-check{width:18px;height:18px;cursor:pointer;accent-color:var(--green-mid)}
.sd-banner{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);display:flex;align-items:flex-start;gap:8px;margin-top:10px;line-height:1.5}
/* Day total */
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--green);border-radius:var(--radius);margin-top:4px}
.total-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.7);text-transform:uppercase}
.total-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:#fff}
.total-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.save-indicator{font-size:11px;color:var(--text-3);transition:opacity .3s;opacity:0}
.save-indicator.show{opacity:1}
/* Top action bar */
.action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.action-bar-left{display:flex;flex-direction:column}
.view-sheet-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.view-sheet-btn:hover{background:var(--green);color:#fff}
/* Records */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rec-hdr{display:flex;align-items:center;gap:14px;padding:14px 20px}
.rec-date{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;min-width:100px;color:var(--text)}
.rec-today-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-light);border:1px solid var(--green-mid);border-radius:20px;padding:1px 8px;margin-left:-6px}
.rec-meta{font-size:12px;color:var(--text-3);flex:1;line-height:1.4}
.rec-cost{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--green);white-space:nowrap;margin-right:8px}
.sheet-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;color:var(--text-2);transition:all .15s;white-space:nowrap}
.sheet-btn:hover{border-color:var(--green-mid);color:var(--green);background:var(--green-light)}
.project-total-row{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border);margin-top:8px}
.project-total-label{font-size:13px;color:var(--text-3);font-weight:500}
.project-total-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--green)}
/* Summary */
.smry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.smry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);text-align:center}
.smry-num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--green)}
.smry-lbl{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.prog-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border-light)}
.prog-fill{height:100%;background:var(--green-mid);border-radius:4px;transition:width .4s}
.scope-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.scope-row:last-child{border-bottom:none}
.scope-done{color:var(--text);font-weight:500}
.scope-pending{color:var(--text-3)}
.scope-icon{font-size:15px;flex-shrink:0}
.cost-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.cost-row:last-child{border-bottom:none}
.cost-item{color:var(--text-2)}
.cost-val{font-family:'DM Mono',monospace;color:var(--text)}
/* Day Sheet Modal */
.sheet-modal{position:fixed;inset:0;background:#fff;z-index:1000;display:none;flex-direction:column}
.sheet-modal.open{display:flex}
.sheet-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--border);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text-2);background:none;border:none;font-family:'Barlow',sans-serif;font-weight:600;padding:6px 0}
.back-btn:hover{color:var(--green)}
.toolbar-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;color:var(--text-3)}
.pdf-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 20px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.pdf-btn:hover{background:var(--green-mid)}
.sheet-scroll{flex:1;overflow-y:auto;padding:48px;display:flex;justify-content:center}
.sheet-doc{width:100%;max-width:680px}
/* Day sheet document styles */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:20px;border-bottom:3px solid var(--green);margin-bottom:28px}
.doc-logo-block{}
.doc-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.doc-title{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--green);line-height:1}
.doc-sub{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--text-3);margin-top:3px}
.doc-meta-block{text-align:right}
.doc-date{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text)}
.doc-meta-grid{display:grid;grid-template-columns:auto auto;gap:2px 16px;margin-top:6px;text-align:left}
.doc-meta-label{font-size:11px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.doc-meta-val{font-size:12px;color:var(--text);font-weight:500}
.doc-section{margin-bottom:24px}
.doc-section-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);border-bottom:1px solid var(--green-light);padding-bottom:6px;margin-bottom:12px}
.doc-table{width:100%;border-collapse:collapse;font-size:13px}
.doc-table th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding:4px 8px;border-bottom:1px solid var(--border)}
.doc-table th:last-child,.doc-table td:last-child{text-align:right}
.doc-table td{padding:8px 8px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.doc-table td.mono{font-family:'DM Mono',monospace;font-weight:500;color:var(--text)}
.doc-table tfoot td{font-weight:600;border-top:2px solid var(--border);border-bottom:none;padding-top:10px;color:var(--text)}
.doc-table tfoot td.mono{color:var(--green)}
.doc-works-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.doc-works-item:last-child{border-bottom:none}
.doc-badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-done{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid)}
.badge-prog{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.doc-total{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--green);border-radius:var(--radius);margin-top:28px}
.doc-total-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.doc-total-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:#fff}
.doc-notes{font-size:13px;color:var(--text-2);line-height:1.7;padding:12px 16px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--green-mid)}
.doc-footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}
.doc-sec-sub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:12px 0 6px}
.no-works{font-size:13px;color:var(--text-3);font-style:italic;padding:4px 0}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Civil Works</div>
      <div class="sidebar-project">Clarke Creek<br>Wind Farm</div>
      <div class="sidebar-sub">Part D — Civil Scope</div>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item on" id="nav-today" onclick="sw('today')">
        <span class="nav-icon">📋</span> Today
      </button>
      <button class="nav-item" id="nav-rec" onclick="sw('rec')">
        <span class="nav-icon">🗂</span> Records
      </button>
      <button class="nav-item" id="nav-smry" onclick="sw('smry')">
        <span class="nav-icon">📊</span> Summary
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-date" id="sidebar-date"></div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">
        <button class="sidebar-action-btn" onclick="exportData()">&#x2B07; Export backup</button>
        <button class="sidebar-action-btn" onclick="document.getElementById('import-input').click()">&#x2B06; Import backup</button>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main">
    <div id="p-today"></div>
    <div id="p-rec" style="display:none"></div>
    <div id="p-smry" style="display:none"></div>
  </main>
</div>

<!-- Day Sheet Modal -->
<div class="sheet-modal" id="sheet-modal">
  <div class="sheet-toolbar">
    <button class="back-btn" onclick="closeSheet()">← Back</button>
    <span class="toolbar-title" id="sheet-modal-title">Day Sheet</span>
    <button class="pdf-btn" id="pdf-btn" onclick="generatePDF()">⬇ Download PDF</button>
  </div>
  <div class="sheet-scroll">
    <div class="sheet-doc" id="sheet-doc"></div>
  </div>
</div>

<script>
const KEY='ccwf_diary_v1';
const SUPA_URL='https://hvxyqfbzmbuejjundnat.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eHlxZmJ6bWJ1ZWpqdW5kbmF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODI0MTAsImV4cCI6MjA5NDM1ODQxMH0.Bx0VV2KtltzzyUqtWtBxeAP_-sbbyMjbolN_JoPgE1I';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const PLANT_RATES={'Cat 140m Grader':2779.90,'13t Smooth Drum Roller':1265,'13t Padfoot Roller':1265,'14000L Water Truck':1803.43,'14t Excavator':2049,'1000L Fuel Trailer':491.05,'Site Ute':190};
const PERS_RATES={'Manager / Supervisor':1100,'Labourer':795.50};

  {lbl:'Track Rectification',items:['Access 4 to the central substation','Central sub access track','T70 to T69','Cow creek to 50 intersection','T50 to T49','T36 to T35','Red hill and Slippery hill',"Sean's track",'33 to 3 ways in sections','T26 to T27','T23 to T21','T31 to 30 down Tom\'s track','T78 to T80 through Devils elbow','T80 to T81','T81 to T82','T90 hill','T111 to T100','T100 to T99','T96 to T95','T111 to T103','T84 to T83','Jacks hill']},

const FLAT=[];
SECS.forEach((s,si)=>s.items.forEach((item,ii)=>FLAT.push({id:`s${si}_${ii}`,label:item,sec:s.lbl})));
const WX=[{k:'sunny',e:'☀️',lbl:'Sunny'},{k:'cloudy',e:'⛅',lbl:'Cloudy'},{k:'wet',e:'🌧',lbl:'Wet'},{k:'storm',e:'⛈',lbl:'Storm'}];
const TOTAL=FLAT.length;
let diary={},today=new Date().toISOString().split('T')[0],saveT=null;


function exportData(){
  const data={diary:diary,exported:new Date().toISOString(),version:'ccwf_v1'};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='CCWF_Diary_Backup_'+today+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.diary)throw new Error('Invalid backup file');
      const count=Object.keys(data.diary).length;
      if(!confirm('Import '+count+' day record(s) from backup?\n\nThis will merge with existing data. Existing days will be overwritten if there is a conflict.'))return;
      diary={...diary,...data.diary};
      localStorage.setItem(KEY,JSON.stringify(diary));
      // Sync all imported records to Supabase
      try{
        const rows=Object.entries(diary).map(([date,d])=>({date,data:d,updated_at:new Date().toISOString()}));
        await sb.from('diary').upsert(rows,{onConflict:'date'});
      }catch(e){}
      renderToday();renderRec();renderSmry();
      alert('Import successful — '+count+' records loaded and synced.');
    }catch(err){
      alert('Import failed: '+err.message);
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

async function load(){
  const el=document.getElementById('sav-ind');
  if(el){el.textContent='Syncing...';el.classList.add('show');}
  try{
    const {data,error}=await sb.from('diary').select('*');
    if(!error&&data&&data.length){
      diary={};
      data.forEach(row=>{diary[row.date]=row.data;});
      try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
    } else {
      try{const r=localStorage.getItem(KEY);if(r)diary=JSON.parse(r);}catch(e){}
    }
  } catch(e){
    try{const r=localStorage.getItem(KEY);if(r)diary=JSON.parse(r);}catch(e2){}
  }
  if(el){el.classList.remove('show');}
  document.getElementById('sidebar-date').textContent=fmtD(today);
  renderToday();renderRec();renderSmry();
}

function save(){
  // Write to localStorage immediately as cache
  try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
  const el=document.getElementById('sav-ind');
  if(el){el.textContent='Saving...';el.classList.add('show');}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      const {error}=await sb.from('diary').upsert({
        date:today,
        data:diary[today]||{},
        updated_at:new Date().toISOString()
      },{onConflict:'date'});
      if(el){
        el.textContent=error?'Local only ✓':'Synced ✓';
        setTimeout(()=>el.classList.remove('show'),1500);
      }
    } catch(e){
      if(el){el.textContent='Local only ✓';setTimeout(()=>el.classList.remove('show'),1500);}
    }
    renderRec();renderSmry();
  },400);
}

function sw(tab){
  ['today','rec','smry'].forEach(t=>{
    document.getElementById('nav-'+t).classList.toggle('on',t===tab);
    document.getElementById('p-'+t).style.display=t===tab?'block':'none';
  });
  if(tab==='rec')renderRec();
  if(tab==='smry')renderSmry();
}

function day(date){
  if(!diary[date])diary[date]={weather:'',conditions:'',plant:[],personnel:[],works:[],completed:[],fuelL:0,standDown:false,notes:''};
  return diary[date];
}

function calcCost(date){
  const d=diary[date]||{};
  if(d.standDown)return SD_R+(d.fuelL||0)*FUEL_R;
  let t=0;
  (d.plant||[]).forEach(p=>t+=(PLANT_RATES[p]||0));
  (d.personnel||[]).forEach(p=>t+=(PERS_RATES[p]||0));
  t+=(d.fuelL||0)*FUEL_R;
  return t;
}

function money(n){return'$'+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtD(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y}`;}
function fmtDShort(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y.slice(2)}`;}
function wxLabel(k){return WX.find(w=>w.k===k)?.lbl||'Not recorded';}
function wxEmoji(k){return WX.find(w=>w.k===k)?.e||'🌤';}

// Today
function addPlant(){const s=document.getElementById('plant-sel');const v=s?.value;if(!v)return;day(today).plant.push(v);save();renderOnSite();}
function removePlant(i){day(today).plant.splice(i,1);save();renderOnSite();}
function addPers(){const s=document.getElementById('pers-sel');const v=s?.value;if(!v)return;day(today).personnel.push(v);save();renderOnSite();}
function removePers(i){day(today).personnel.splice(i,1);save();renderOnSite();}
function setWx(w){day(today).weather=w;save();renderToday();}
function setCond(v){day(today).conditions=v;save();}
function toggleWork(id){
  const d=day(today);const i=d.works.indexOf(id);
  if(i===-1)d.works.push(id);else{d.works.splice(i,1);const ci=d.completed.indexOf(id);if(ci!==-1)d.completed.splice(ci,1);}
  save();renderWorks();
}
function toggleDone(id,e){
  e.stopPropagation();
  const d=day(today);const i=d.completed.indexOf(id);
  i===-1?d.completed.push(id):d.completed.splice(i,1);
  save();renderWorks();
}
function setFuel(v){day(today).fuelL=parseFloat(v)||0;save();renderOnSite();}
function setSD(v){day(today).standDown=v;save();renderOnSite();}
function setNotes(v){day(today).notes=v;save();}

function renderOnSite(){
  const d=day(today);const sd=d.standDown;
  const pl=document.getElementById('plant-list');
  const pe=document.getElementById('pers-list');
  const tv=document.getElementById('total-val');
  const ts=document.getElementById('total-sub');
  const fuelCalc=document.getElementById('fuel-calc');
  if(pl)pl.innerHTML=d.plant.length?d.plant.map((p,i)=>`
    <div class="on-site-item plant-type${sd?' dimmed':''}">
      <div><div class="item-info-name">${p}</div><div class="item-info-rate">${money(PLANT_RATES[p]||0)}/day${sd?' — replaced by stand down':''}</div></div>
      <button class="rm-btn" onclick="removePlant(${i})">✕ Remove</button>
    </div>`).join(''):`<div class="on-site-empty">No plant added yet.</div>`;
  if(pe)pe.innerHTML=d.personnel.length?d.personnel.map((p,i)=>`
    <div class="on-site-item pers-type${sd?' dimmed':''}">
      <div><div class="item-info-name">${p}</div><div class="item-info-rate">${money(PERS_RATES[p]||0)}/day${sd?' — replaced by stand down':''}</div></div>
      <button class="rm-btn" onclick="removePers(${i})">✕ Remove</button>
    </div>`).join(''):`<div class="on-site-empty">No personnel added yet.</div>`;
  if(tv)tv.textContent=money(calcCost(today));
  if(ts)ts.textContent=sd?'Stand down rate applied — plant & personnel replaced':'Plant + personnel + fuel';
  if(fuelCalc)fuelCalc.textContent=money((d.fuelL||0)*FUEL_R);
}

function renderWorks(){
  const d=day(today);
  const el=document.getElementById('works-list');if(!el)return;
  let html='',ls='';
  FLAT.forEach(({id,label,sec})=>{
    const sel=d.works.includes(id),done=d.completed.includes(id);
    if(sec!==ls){html+=`<div class="sec-hdr">${sec}</div>`;ls=sec;}
    html+=`<div class="work-item${sel?' sel':''}" onclick="toggleWork('${id}')">
      <div class="work-cb${done?' done':''}">${done?'✓':''}</div>
      <span class="work-label">${label}</span>
      ${sel?`<button class="work-done-btn${done?' done':''}" onclick="toggleDone('${id}',event)">${done?'✓ Done':'Mark done'}</button>`:''}
    </div>`;
  });
  el.innerHTML=html;
}

// Records

  const dates=Object.keys(diary).sort().reverse();
  const el=document.getElementById('p-rec');
  let run=0;
  if(!dates.length){el.innerHTML=`<div class="page-title">Records</div><div class="page-sub">No records yet.</div>`;return;}
  const cards=dates.map(date=>{
    const d=diary[date]||{};
    const allP=[...(d.plant||[]),...(d.personnel||[])];
    const cost=calcCost(date);run+=cost;
    const isToday=date===today;
    return`<div class="rec-card">
      <div class="rec-hdr">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${wxEmoji(d.weather)}</span>

            <div style="display:flex;align-items:center;gap:8px">

              ${isToday?'<span class="rec-today-badge">TODAY</span>':''}

// Summary
function renderSmry(){
  const allDates=Object.keys(diary);
  const totalCost=allDates.reduce((a,d)=>a+calcCost(d),0);
  const daysOn=allDates.filter(d=>(diary[d].plant||[]).length||(diary[d].personnel||[]).length||diary[d].standDown).length;
  const sdDays=allDates.filter(d=>diary[d].standDown).length;
  const completedIds=new Set();
  allDates.forEach(d=>(diary[d].completed||[]).forEach(id=>completedIds.add(id)));
  const done=completedIds.size;
  const plantTotals={};
  allDates.forEach(date=>{
    const d=diary[date]||{};if(d.standDown)return;
    [...(d.plant||[]),...(d.personnel||[])].forEach(p=>{plantTotals[p]=(plantTotals[p]||0)+(ALL_RATES[p]||0);});
  });
  const pct=Math.round(done/TOTAL*100);
  let html=`
    <div class="page-title">Summary</div>
    <div class="page-sub">Clarke Creek Wind Farm — Part D Civil Scope</div>
    <div class="smry-grid">
      <div class="smry-card"><div class="smry-num">${money(totalCost)}</div><div class="smry-lbl">Running total (ex GST)</div></div>
      <div class="smry-card"><div class="smry-num">${daysOn}${sdDays?`<span style='font-size:14px;display:block;margin-top:2px'>${sdDays} stand down</span>`:''}</div><div class="smry-lbl">Days on site</div></div>
      <div class="smry-card"><div class="smry-num">${done}/${TOTAL}</div><div class="smry-lbl">Sections completed</div></div>
    </div>
    <div class="card">
      <div class="card-title">Scope Progress — ${pct}% complete</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--text-3);margin-bottom:14px">${done} of ${TOTAL} sections marked done</div>`;
  let ls='';
  FLAT.forEach(({id,label,sec})=>{
    const d=completedIds.has(id);
    if(sec!==ls){html+=`<div class="sec-hdr">${sec}</div>`;ls=sec;}
    html+=`<div class="scope-row"><span class="scope-icon">${d?'✅':'⬜'}</span><span class="${d?'scope-done':'scope-pending'}">${label}</span></div>`;
  });
  html+=`</div>`;
  if(Object.keys(plantTotals).length){
    html+=`<div class="card"><div class="card-title">Cost by Item (Productive Days)</div>`;
    Object.entries(plantTotals).sort((a,b)=>b[1]-a[1]).forEach(([p,t])=>{
      html+=`<div class="cost-row"><span class="cost-item">${p}</span><span class="cost-val">${money(t)}</span></div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('p-smry').innerHTML=html;
}

// Day Sheet
let currentSheetDate=null;
function openSheet(date){
  currentSheetDate=date;
  const d=diary[date]||{};const sd=d.standDown;
  const allPlant=d.plant||[];const allPers=d.personnel||[];
  const workedItems=FLAT.filter(s=>(d.works||[]).includes(s.id));
  document.getElementById('sheet-modal-title').textContent=`Day Sheet — ${fmtD(date)}`;

  // Plant rows
  let plantRows='';
  let plantTotal=0;
  if(sd){
    plantRows=`<tr><td colspan="2" style="color:var(--text-3);font-style:italic">Stand down — plant & personnel costs replaced by stand down rate</td><td class="mono">${money(SD_R)}</td></tr>`;
    plantTotal=SD_R;
  } else {
    allPlant.forEach(p=>{const r=PLANT_RATES[p]||0;plantTotal+=r;plantRows+=`<tr><td>${p}</td><td style="color:var(--text-3);font-family:'DM Mono',monospace">${money(r)}/day × 1</td><td class="mono">${money(r)}</td></tr>`;});
    allPers.forEach(p=>{const r=PERS_RATES[p]||0;plantTotal+=r;plantRows+=`<tr><td>${p}</td><td style="color:var(--text-3);font-family:'DM Mono',monospace">${money(r)}/day × 1</td><td class="mono">${money(r)}</td></tr>`;});
    if(!allPlant.length&&!allPers.length)plantRows=`<tr><td colspan="3" style="color:var(--text-3);font-style:italic">No plant or personnel recorded</td></tr>`;
  }
  const fuelAmt=(d.fuelL||0)*FUEL_R;
  const fuelRow=fuelAmt>0?`<tr><td>Fuel (${d.fuelL}L × $2.50/L)</td><td></td><td class="mono">${money(fuelAmt)}</td></tr>`:'';

  // Works by section
  const bySec={};
  workedItems.forEach(s=>{if(!bySec[s.sec])bySec[s.sec]=[];bySec[s.sec].push(s);});
  let worksHtml='';
  if(Object.keys(bySec).length){
    Object.entries(bySec).forEach(([sec,items])=>{
      worksHtml+=`<div class="doc-sec-sub">${sec}</div>`;
      items.forEach(s=>{
        const done=(d.completed||[]).includes(s.id);
        worksHtml+=`<div class="doc-works-item"><span style="flex:1;color:var(--text-2)">${s.label}</span><span class="doc-badge ${done?'badge-done':'badge-prog'}">${done?'Completed':'In Progress'}</span></div>`;
      });
    });
  } else {
    worksHtml=`<div class="no-works">No works recorded for this day.</div>`;
  }

  document.getElementById('sheet-doc').innerHTML=`
  <div class="doc-header">
    <div class="doc-logo-block">
      <div class="doc-label">Civil Works Day Sheet</div>
      <div class="doc-title">Clarke Creek<br>Wind Farm</div>
      <div class="doc-sub">Part D — Civil Scope of Works</div>
    </div>
    <div class="doc-meta-block">
      <div class="doc-date">${fmtDShort(date)}</div>
      <div class="doc-meta-grid">
        <span class="doc-meta-label">Weather</span><span class="doc-meta-val">${wxEmoji(d.weather)} ${wxLabel(d.weather)}</span>
        <span class="doc-meta-label">Conditions</span><span class="doc-meta-val">${d.conditions||'Not recorded'}</span>
      </div>
    </div>
  </div>

  <div class="doc-section">
    <div class="doc-section-title">Plant & Personnel on Site</div>
    <table class="doc-table">
      <thead><tr><th>Item</th><th>Rate</th><th>Amount</th></tr></thead>
      <tbody>${plantRows}${fuelRow}</tbody>
      <tfoot><tr><td colspan="2" style="font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.04em">Subtotal</td><td class="mono">${money(plantTotal+fuelAmt)}</td></tr></tfoot>
    </table>
  </div>

  <div class="doc-section">
    <div class="doc-section-title">Works Undertaken</div>
    ${worksHtml}
  </div>

  ${d.notes?`<div class="doc-section"><div class="doc-section-title">Notes</div><div class="doc-notes">${d.notes}</div></div>`:''}

  <div class="doc-total">
    <div class="doc-total-label">Day Total (ex GST)</div>
    <div class="doc-total-val">${money(calcCost(date))}</div>
  </div>

  <div class="doc-footer">
    <span>Clarke Creek Wind Farm — Civil Works Day Sheet</span>
    <span>Generated ${fmtD(today)}</span>
  </div>`;

  document.getElementById('sheet-modal').classList.add('open');
}

function closeSheet(){
  document.getElementById('sheet-modal').classList.remove('open');
}

// PDF Generation
function generatePDF(){
  const btn=document.getElementById('pdf-btn');
  btn.textContent='Generating...';btn.disabled=true;
  try{
    const date=currentSheetDate;
    const d=diary[date]||{};const sd=d.standDown;
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,ml=20,mr=20,cw=W-ml-mr;
    let y=20;
    const green=[31,92,46],greenMid=[46,125,62],grey=[100,100,100],lightGrey=[180,180,180],black=[26,26,26];

    function line(x1,y1,x2,y2,color=[220,220,215],lw=0.3){doc.setDrawColor(...color);doc.setLineWidth(lw);doc.line(x1,y1,x2,y2);}
    function rect(x,rx,rw,rh,color){doc.setFillColor(...color);doc.rect(x,rx,rw,rh,'F');}

    // Header bar
    rect(0,0,W,42,[31,92,46]);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');
    doc.text('CIVIL WORKS DAY SHEET',ml,14);
    doc.setFontSize(18);doc.text('Clarke Creek Wind Farm',ml,24);
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(200,230,205);
    doc.text('Part D — Civil Scope of Works',ml,31);
    // Date on right
    doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
    doc.text(fmtDShort(date),W-mr,24,{align:'right'});
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(200,230,205);
    doc.text(`Weather: ${wxLabel(d.weather)}`,W-mr,31,{align:'right'});
    if(d.conditions){doc.text(d.conditions.length>40?d.conditions.slice(0,40)+'…':d.conditions,W-mr,36,{align:'right'});}
    y=52;

    // Section heading function
    function sectionTitle(title){
      doc.setFillColor(...greenMid);doc.rect(ml,y,cw,6,'F');
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
      doc.text(title.toUpperCase(),ml+3,y+4);
      y+=10;doc.setTextColor(...black);
    }

    // Plant & Personnel
    sectionTitle('Plant & Personnel on Site');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...grey);
    doc.text('ITEM',ml,y);doc.text('RATE',ml+100,y);doc.text('AMOUNT',W-mr,y,{align:'right'});
    y+=4;line(ml,y,W-mr,y,[200,200,200]);y+=4;

    const allPlant=d.plant||[];const allPers=d.personnel||[];
    let plantSubtotal=0;
    doc.setFont('helvetica','normal');doc.setTextColor(...black);

    if(sd){
      doc.setFontSize(9);doc.text('Stand down — plant & personnel costs replaced',ml,y);
      doc.text(money(SD_R),W-mr,y,{align:'right'});
      plantSubtotal=SD_R;y+=7;
    } else {
      allPlant.forEach(p=>{
        const r=PLANT_RATES[p]||0;plantSubtotal+=r;
        doc.setFontSize(9);doc.text(p,ml,y);
        doc.setTextColor(...grey);doc.text(money(r)+'/day',ml+100,y);
        doc.setTextColor(...black);doc.text(money(r),W-mr,y,{align:'right'});
        y+=7;
      });
      allPers.forEach(p=>{
        const r=PERS_RATES[p]||0;plantSubtotal+=r;
        doc.setFontSize(9);doc.text(p,ml,y);
        doc.setTextColor(...grey);doc.text(money(r)+'/day',ml+100,y);
        doc.setTextColor(...black);doc.text(money(r),W-mr,y,{align:'right'});
        y+=7;
      });
      if(!allPlant.length&&!allPers.length){doc.setTextColor(...grey);doc.setFontSize(9);doc.text('No plant or personnel recorded',ml,y);y+=7;doc.setTextColor(...black);}
    }
    const fuelAmt=(d.fuelL||0)*FUEL_R;
    if(fuelAmt>0){
      doc.setFontSize(9);doc.text(`Fuel (${d.fuelL}L × $2.50/L)`,ml,y);
      doc.text(money(fuelAmt),W-mr,y,{align:'right'});
      y+=7;
    }
    line(ml+80,y,W-mr,y);y+=4;
    doc.setFont('helvetica','bold');doc.setFontSize(9);
    doc.text('Subtotal',ml+80,y);doc.text(money(plantSubtotal+fuelAmt),W-mr,y,{align:'right'});
    y+=12;

    // Works
    sectionTitle('Works Undertaken');
    const workedItems=FLAT.filter(s=>(d.works||[]).includes(s.id));
    if(workedItems.length){
      const bySec={};
      workedItems.forEach(s=>{if(!bySec[s.sec])bySec[s.sec]=[];bySec[s.sec].push(s);});
      Object.entries(bySec).forEach(([sec,items])=>{
        doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...grey);
        doc.text(sec.toUpperCase(),ml,y);y+=5;
        items.forEach(s=>{
          const done=(d.completed||[]).includes(s.id);
          doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...black);
          const bullet=done?'✓':'•';
          doc.text(bullet,ml+2,y);doc.text(s.label,ml+8,y);
          doc.setFont('helvetica','bold');
          if(done){doc.setTextColor(46,125,62);}else{doc.setTextColor(123,94,0);}
          doc.text(done?'COMPLETED':'IN PROGRESS',W-mr,y,{align:'right'});
          doc.setTextColor(...black);y+=6;
        });
        y+=2;
      });
    } else {
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...grey);
      doc.text('No works recorded for this day.',ml,y);y+=8;
    }
    y+=4;

    // Notes
    if(d.notes){
      sectionTitle('Notes');
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...black);
      const lines=doc.splitTextToSize(d.notes,cw-6);
      rect(ml,y-3,cw,lines.length*5+6,[245,244,240]);
      doc.text(lines,ml+4,y+1);
      y+=lines.length*5+10;
    }

    // Total
    y+=4;
    rect(ml,y,cw,14,[31,92,46]);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
    doc.text('DAY TOTAL (EX GST)',ml+4,y+9);
    doc.setFontSize(14);doc.setFont('helvetica','bold');
    doc.text(money(calcCost(date)),W-mr,y+9,{align:'right'});
    y+=22;

    // Footer
    line(ml,y,W-mr,y);y+=4;
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...lightGrey);
    doc.text('Clarke Creek Wind Farm — Civil Works Day Sheet',ml,y);
    doc.text(`Generated ${fmtD(today)}`,W-mr,y,{align:'right'});

    doc.save(`CCWF_Day_Sheet_${date}.pdf`);
  } catch(err){console.error(err);alert('PDF generation failed: '+err.message);}
  btn.textContent='⬇ Download PDF';btn.disabled=false;
}

load();
</script>
</body>
</html>
