<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F5C2E">
<meta http-equiv="Cache-Control" content="no-cache">
<title>CCWF Civil Works — Site Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F2F0EB;
  --surface:#FFFFFF;
  --border:#DDD9D0;
  --border-light:#EAE7E0;
  --green:#1F5C2E;
  --green-mid:#2E7D3E;
  --green-light:#E8F3EA;
  --green-accent:#3A9B50;
  --amber:#7B5E00;
  --amber-bg:#FFF8E1;
  --amber-border:#FFD54F;
  --red:#C0392B;
  --red-bg:#FDECEA;
  --text:#1A1A1A;
  --text-2:#4A4A4A;
  --text-3:#888;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --radius:8px;
  --radius-sm:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-text-size-adjust:100%}
/* Layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--green);padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px}
.sidebar-project{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
.sidebar-nav{padding:16px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.on{color:#fff;background:rgba(255,255,255,.15)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}

.sidebar-action-btn{width:100%;font-size:12px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;text-align:left;transition:all .15s}
.sidebar-action-btn:hover{background:rgba(255,255,255,.15);color:#fff}

.lock-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid #888;background:none;color:#888;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.lock-btn:hover{border-color:var(--text);color:var(--text)}
.save-day-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green);color:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.save-day-btn:hover{background:var(--green-mid)}
.save-day-btn:disabled{opacity:.5;cursor:wait}
.unlock-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--amber);background:var(--amber-bg);color:var(--amber);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.del-day-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.del-day-btn:hover{background:var(--red);color:#fff}
.lock-banner{background:#E8F3EA;border:1px solid var(--green-mid);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:8px;margin-bottom:16px;font-weight:500}
.edit-btn{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap}
.edit-btn:hover{background:var(--green);color:#fff}
.locked-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:#E8F3EA;color:var(--green);border:1px solid var(--green-mid);white-space:nowrap}
.rec-card.locked{border-left:3px solid var(--green-mid)}
.form-disabled input,.form-disabled select,.form-disabled textarea,.form-disabled button:not(.unlock-trigger):not(.photo-trigger):not(.scope-photo-btn){pointer-events:none;opacity:.5}
.sidebar-date{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.4)}
.main{padding:32px 40px;overflow-y:auto}
/* Cards */
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-3);margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
/* Weather */
.wx-row{display:flex;gap:8px;flex-wrap:wrap}
.wx-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:none;cursor:pointer;font-size:13px;font-family:'Barlow',sans-serif;color:var(--text-2);transition:all .15s;font-weight:500}
.wx-btn:hover{border-color:var(--green-mid);color:var(--green)}
.wx-btn.on{border-color:var(--green-mid);background:var(--green-light);color:var(--green)}
.wx-icon{font-size:16px}
/* Plant/Personnel */
.on-site-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.on-site-empty{font-size:12px;color:var(--text-3);padding:8px 0;font-style:italic}
.on-site-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border-light)}
.on-site-item.plant-type{border-left:3px solid var(--green-accent)}
.on-site-item.pers-type{border-left:3px solid var(--green)}
.on-site-item.dimmed{opacity:.4}
.item-info-name{font-size:13px;font-weight:600;color:var(--text)}
.item-info-rate{font-size:11px;color:var(--text-3);font-family:'DM Mono',monospace;margin-top:2px}
.rm-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--red);background:none;border:1px solid var(--red);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;transition:all .15s}
.rm-btn:hover{background:var(--red-bg)}
.add-row{display:flex;gap:8px}
.add-select{flex:1;font-size:13px;padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Barlow',sans-serif;cursor:pointer}
.add-select:focus{outline:none;border-color:var(--green-mid)}
.add-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap}
.add-btn:hover{background:var(--green);color:#fff}
.add-btn:disabled{opacity:.35;pointer-events:none}
.divider{height:1px;background:var(--border-light);margin:16px 0}
/* Works */
.works-list{display:flex;flex-direction:column;gap:3px}
.work-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;transition:all .12s}
.work-item:hover{background:var(--bg)}
.work-item.sel{border-color:var(--border);background:var(--bg)}
.work-cb{width:18px;height:18px;min-width:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-size:11px;color:#fff}
.work-cb.done{background:var(--green-mid);border-color:var(--green-mid)}
.work-label{font-size:13px;line-height:1.4;flex:1;color:var(--text-2)}
.work-done-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text-3);white-space:nowrap;font-family:'Barlow',sans-serif;font-weight:500;transition:all .15s}
.work-done-btn:hover{border-color:var(--green-mid);color:var(--green)}
.work-done-btn.done{background:var(--green-light);border-color:var(--green-mid);color:var(--green)}
.sec-hdr{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:10px 0 4px;border-top:1px solid var(--border-light);margin-top:4px}
.sec-hdr:first-child{border-top:none;margin-top:0;padding-top:0}
.hint{display:flex;gap:6px;font-size:11px;color:var(--text-3);margin-bottom:12px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);line-height:1.5;border:1px solid var(--border-light)}
/* Inputs */
.text-input{width:100%;font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Barlow',sans-serif;transition:border-color .15s}
.text-input:focus{outline:none;border-color:var(--green-mid)}
textarea.text-input{resize:vertical;min-height:80px}
/* Fuel/SD */
.fuel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fuel-input{width:90px;font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);text-align:right;font-family:'DM Mono',monospace}
.fuel-input:focus{outline:none;border-color:var(--green-mid)}
.fuel-label{font-size:13px;color:var(--text-2);font-weight:500}
.fuel-calc{font-family:'DM Mono',monospace;font-size:13px;color:var(--text-3)}
.sd-row{display:flex;align-items:center;gap:10px;font-size:13px}
.sd-check{width:18px;height:18px;cursor:pointer;accent-color:var(--green-mid)}
.sd-banner{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);display:flex;align-items:flex-start;gap:8px;margin-top:10px;line-height:1.5}
/* Day total */
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--green);border-radius:var(--radius);margin-top:4px}
.total-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.7);text-transform:uppercase}
.total-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:#fff}
.total-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.save-indicator{font-size:11px;color:var(--text-3);transition:opacity .3s;opacity:0}
.save-indicator.show{opacity:1}
/* Top action bar */
.action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.action-bar-left{display:flex;flex-direction:column}
.view-sheet-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 18px;border-radius:var(--radius-sm);border:1.5px solid var(--green-mid);background:var(--green-light);color:var(--green);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.view-sheet-btn:hover{background:var(--green);color:#fff}
/* Records */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rec-hdr{display:flex;align-items:center;gap:14px;padding:14px 20px}
.rec-date{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;min-width:100px;color:var(--text)}
.rec-today-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-light);border:1px solid var(--green-mid);border-radius:20px;padding:1px 8px;margin-left:-6px}
.rec-meta{font-size:12px;color:var(--text-3);flex:1;line-height:1.4}
.rec-cost{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--green);white-space:nowrap;margin-right:8px}
.sheet-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;color:var(--text-2);transition:all .15s;white-space:nowrap}
.sheet-btn:hover{border-color:var(--green-mid);color:var(--green);background:var(--green-light)}
.project-total-row{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border);margin-top:8px}
.project-total-label{font-size:13px;color:var(--text-3);font-weight:500}
.project-total-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--green)}
/* Summary */
.smry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.smry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);text-align:center}
.smry-num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--green)}
.smry-lbl{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.prog-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border-light)}
.prog-fill{height:100%;background:var(--green-mid);border-radius:4px;transition:width .4s}
.scope-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.scope-row:last-child{border-bottom:none}
.scope-done{color:var(--text);font-weight:500}
.scope-pending{color:var(--text-3)}
.scope-icon{font-size:15px;flex-shrink:0}
.cost-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.cost-row:last-child{border-bottom:none}
.cost-item{color:var(--text-2)}
.cost-val{font-family:'DM Mono',monospace;color:var(--text)}
/* Day Sheet Modal */
.sheet-modal{position:fixed;inset:0;background:#fff;z-index:1000;display:none;flex-direction:column}
.sheet-modal.open{display:flex}
.sheet-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--border);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text-2);background:none;border:none;font-family:'Barlow',sans-serif;font-weight:600;padding:6px 0}
.back-btn:hover{color:var(--green)}
.toolbar-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;color:var(--text-3)}
.pdf-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 20px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;transition:all .15s}
.pdf-btn:hover{background:var(--green-mid)}
.sheet-scroll{flex:1;overflow-y:auto;padding:48px;display:flex;justify-content:center}
.sheet-doc{width:100%;max-width:680px}
/* Day sheet document styles */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:20px;border-bottom:3px solid var(--green);margin-bottom:28px}
.doc-logo-block{}
.doc-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.doc-title{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--green);line-height:1}
.doc-sub{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--text-3);margin-top:3px}
.doc-meta-block{text-align:right}
.doc-date{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text)}
.doc-meta-grid{display:grid;grid-template-columns:auto auto;gap:2px 16px;margin-top:6px;text-align:left}
.doc-meta-label{font-size:11px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.doc-meta-val{font-size:12px;color:var(--text);font-weight:500}
.doc-section{margin-bottom:24px}
.doc-section-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);border-bottom:1px solid var(--green-light);padding-bottom:6px;margin-bottom:12px}
.doc-table{width:100%;border-collapse:collapse;font-size:13px}
.doc-table th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding:4px 8px;border-bottom:1px solid var(--border)}
.doc-table th:last-child,.doc-table td:last-child{text-align:right}
.doc-table td{padding:8px 8px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.doc-table td.mono{font-family:'DM Mono',monospace;font-weight:500;color:var(--text)}
.doc-table tfoot td{font-weight:600;border-top:2px solid var(--border);border-bottom:none;padding-top:10px;color:var(--text)}
.doc-table tfoot td.mono{color:var(--green)}
.doc-works-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.doc-works-item:last-child{border-bottom:none}
.doc-badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-done{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid)}
.badge-prog{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.doc-total{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--green);border-radius:var(--radius);margin-top:28px}
.doc-total-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.doc-total-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:#fff}
.doc-notes{font-size:13px;color:var(--text-2);line-height:1.7;padding:12px 16px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--green-mid)}
.doc-footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}
.doc-sec-sub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:12px 0 6px}
.no-works{font-size:13px;color:var(--text-3);font-style:italic;padding:4px 0}

/* ── Photo evidence ──────────────────────────────── */
.scope-row{display:flex;align-items:center;gap:8px}
.scope-photo-btn{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-3);cursor:pointer;font-size:11px;font-family:'Barlow',sans-serif;transition:all .15s}
.scope-photo-btn:hover{border-color:var(--green-mid);color:var(--green);background:var(--green-light)}
.scope-photo-btn.has-photos{border-color:var(--green-mid);background:var(--green-light);color:var(--green)}
.scope-photo-btn svg{width:14px;height:14px}
.scope-photo-count{font-weight:600;font-family:'DM Mono',monospace}
.scope-rm-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:none;color:var(--text-3);cursor:pointer;font-size:11px;font-family:'Barlow',sans-serif}
.scope-rm-btn:hover{border-color:var(--red);color:var(--red)}

// ── Shared rate card (custom plant/personnel + overrides) via Supabase ──────
// The rate card is the same for the whole crew, so it lives in app_config and is
// shared across users/devices. Without this, one user's custom plant resolves to $0
// in another user's records. save → push; load → pull + union + push.
function _pushPlantConfig(){
  try{
    if(!currentUser?.id||typeof sb==='undefined'||!sb)return;
    sb.from('app_config').upsert({id:'plantConfig',data:plantConfig,updated_by:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'id'})
      .then(({error})=>{if(error)console.warn('Rate card sync error:',error);});
  }catch(e){console.warn('Rate card push failed:',e);}
}
function _mergePlantConfig(remote){
  if(!remote||typeof remote!=='object')return;
  const byName=arr=>{const m={};(arr||[]).forEach(c=>{if(c&&c.name)m[c.name]=c;});return m;};
  plantConfig.customPlant=Object.values({...byName(plantConfig.customPlant),...byName(remote.customPlant)});
  plantConfig.customPers=Object.values({...byName(plantConfig.customPers),...byName(remote.customPers)});
  plantConfig.plantOverrides={...(plantConfig.plantOverrides||{}),...(remote.plantOverrides||{})};
  plantConfig.persOverrides={...(plantConfig.persOverrides||{}),...(remote.persOverrides||{})};
  plantConfig.removedPlant=Array.from(new Set([...(plantConfig.removedPlant||[]),...(remote.removedPlant||[])]));
  plantConfig.removedPers=Array.from(new Set([...(plantConfig.removedPers||[]),...(remote.removedPers||[])]));
  if(remote.fuelRate!=null)plantConfig.fuelRate=remote.fuelRate;
  if(remote.standDownRate!=null)plantConfig.standDownRate=remote.standDownRate;
}
async function _pullPlantConfig(){
  try{
    if(typeof sb==='undefined'||!sb)return;
    const {data,error}=await sb.from('app_config').select('data').eq('id','plantConfig').maybeSingle();
    if(error||!data||!data.data)return;
    _mergePlantConfig(data.data);
    try{localStorage.setItem(PLANT_CFG_KEY,JSON.stringify(plantConfig));}catch(e){}
    _pushPlantConfig();  // propagate any local-only customs into the shared card
  }catch(e){console.warn('Rate card pull failed:',e);}
}
function getFuelRate(){return plantConfig.fuelRate!=null?plantConfig.fuelRate:FUEL_R;}

function getRate(name){
  if(plantConfig.plantOverrides[name]!=null)return plantConfig.plantOverrides[name];
  if(plantConfig.persOverrides[name]!=null)return plantConfig.persOverrides[name];
  const cp=plantConfig.customPlant.find(c=>c.name===name);if(cp)return cp.rate;
  const cpe=plantConfig.customPers.find(c=>c.name===name);if(cpe)return cpe.rate;
  return PLANT_RATES[name]!=null?PLANT_RATES[name]:PERS_RATES[name]!=null?PERS_RATES[name]:0;
}
function allPlantItems(){
  return[
    ...PLANT.filter(n=>!plantConfig.removedPlant.includes(n)).map(n=>({name:n,rate:getRate(n),builtin:true})),
    ...plantConfig.customPlant.filter(c=>!plantConfig.removedPlant.includes(c.name)).map(c=>({name:c.name,rate:getRate(c.name),builtin:false}))
  ];
}
function allPersItems(){
  return[
    ...PERS.filter(n=>!plantConfig.removedPers.includes(n)).map(n=>({name:n,rate:getRate(n),builtin:true})),
    ...plantConfig.customPers.filter(c=>!plantConfig.removedPers.includes(c.name)).map(c=>({name:c.name,rate:getRate(c.name),builtin:false}))
  ];
}

// Migrate old works/completed arrays to workItems/powerlineItems
function migrateDayRecord(d){
  if(!d)return;
  if(d.workItems===undefined)d.workItems=[];
  if(d.powerlineItems===undefined)d.powerlineItems=[];
  // Only migrate if workItems is empty and old works exist
  if(d.workItems.length===0&&d.powerlineItems.length===0&&(d.works||[]).length>0){
    (d.works||[]).forEach(function(id){
      const label=LEGACY_SCOPE[id]||id;
      const done=(d.completed||[]).includes(id);
      const isPL=id.startsWith('s1_');
      const item={detail:label,done:done,id:'legacy_'+id};
      if(isPL){d.powerlineItems.push(item);}
      else{item.group='Track Rectification';d.workItems.push(item);}
    });
  }
}

// ── Auth ─────────────────────────────────────────
let authReady=false;
let authResolving=false;  // true while a getSession() is in flight; prevents overlapping retries
async function tryRestoreSession(timeoutMs){
  if(authResolving||authReady)return;
  authResolving=true;
  try{
    const timeout=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),timeoutMs||60000));
    const {data:{session}}=await Promise.race([sb.auth.getSession(),timeout]);
    if(session){currentUser=session.user;currentAccessToken=session.access_token;authReady=true;showApp();await load();}
    else showLogin();
  }catch(e){
    console.warn('tryRestoreSession:',e.message||e);
    // Only show login overlay if we don't already have a session — keeps current UI if user was signed in
    if(!authReady){
      showLogin();
      const errEl=document.getElementById('login-error');
      if(errEl&&e.message==='timeout')errEl.textContent='Network is slow — sign in to continue or wait while we reconnect.';
    }
  }finally{
    authResolving=false;
  }
}
async function initAuth(){
  // Register listener FIRST so SIGNED_IN/TOKEN_REFRESHED events fired during retry are never missed.
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){
      if(!session)return;
      // Always refresh the cached access token (TOKEN_REFRESHED fires periodically),
      // even when we de-dupe the load. Pagehide flush needs a current token.
      currentAccessToken=session.access_token;
      if(currentUser?.id===session.user.id&&authReady)return;  // de-dupe load
      currentUser=session.user;authReady=true;showApp();await load();
    }
    else if(event==='SIGNED_OUT'){currentUser=null;currentAccessToken=null;authReady=false;diary={};allUsersDiary={};unlockedThisSession=new Set();showLogin();}
  });
  // Generous 60s timeout — wake-from-sleep refresh can take >20s on slow networks
  await tryRestoreSession(60000);

  // Auto-retry session restore when network comes back or tab becomes visible.
  // This is the wake-from-sleep / reconnect path that previously kicked users to login.
  window.addEventListener('online',()=>{if(!authReady)tryRestoreSession(30000);});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!authReady)tryRestoreSession(30000);});
}

async function handleLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  const btn=document.getElementById('login-btn');
  if(!email||!pass){errEl.textContent='Please enter your email and password.';return;}
  btn.textContent='Signing in...';btn.disabled=true;errEl.textContent='';
  const resetBtn=()=>{btn.textContent='Sign in';btn.disabled=false;};
  // Hard timeout so the button never stays disabled forever if the network drops.
  const timeoutId=setTimeout(()=>{
    if(btn.disabled){errEl.textContent='Sign in is taking longer than expected — check your connection and try again.';resetBtn();}
  },15000);
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    clearTimeout(timeoutId);
    if(error){errEl.textContent=error.message;resetBtn();return;}
    if(!data?.user){errEl.textContent='Login failed — no user returned. Check Supabase Auth settings.';resetBtn();return;}
    // Success: drive the UI directly instead of waiting for onAuthStateChange.
    currentUser=data.user;authReady=true;
    showApp();
    resetBtn();
    await load();
  } catch(e){
    clearTimeout(timeoutId);
    errEl.textContent='Connection error: '+(e.message||e);
    resetBtn();
  }
}

// Local-time date string (YYYY-MM-DD). toISOString() returns UTC, which made "today"
// wrong for AEST users for ~10 hours after midnight local — see localDateStr usage below.
function localDateStr(d){d=d||new Date();var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,'0');var day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
let diary={},today=localDateStr(),editDate=today,saveT=null;
// Days the user has explicitly unlocked this session. They must NOT be re-locked
// or overwritten by an in-flight load()/autoLockPastDays() while being edited.
let unlockedThisSession=new Set();

// A day record counts as empty when it holds nothing the user actually entered.
// Used to prevent auto-creation of ghost rows when the user just opens the app on
// a date without touching any field.
function isDayEmpty(d){
  if(!d)return true;
  if((d.plant||[]).length)return false;
  if((d.personnel||[]).length)return false;
  if((d.customPlant||[]).length)return false;
  if((d.customPers||[]).length)return false;
  if((d.workItems||[]).length)return false;
  if((d.powerlineItems||[]).length)return false;
  if((d.customScope||[]).length)return false;
  if(d.weather)return false;
  if(d.conditions&&String(d.conditions).trim())return false;
  if(d.notes&&String(d.notes).trim())return false;
  if(d.fuelL)return false;
  if(d.standDown)return false;
  if(d.scopePhotos&&Object.values(d.scopePhotos).some(a=>(a||[]).length))return false;
  return true;
}

// ── Storage ──────────────────────────────────────
async function load(){
  const el=document.getElementById('sav-ind');
  if(el){el.textContent='Syncing...';el.classList.add('show');}

  // Seed from localStorage so any unsynced local edits survive a refresh.
  let localCache={};
  try{const r=localStorage.getItem(KEY);if(r)localCache=JSON.parse(r)||{};}catch(e){}
  diary={...localCache};
  allUsersDiary={};

  // Render IMMEDIATELY with cached data so Today is never blank while we wait for the server.
  loadPlantConfig();
  Object.keys(diary).forEach(d=>migrateDayRecord(diary[d]));
  const sdEl=document.getElementById('sidebar-date');if(sdEl)sdEl.textContent=fmtD(today);
  renderToday();renderRec();renderSmry();

  // Fetch from server with a 15s timeout so the load can never hang indefinitely
  // (e.g. when access token is mid-refresh on a slow network).
  try{
    const fetchPromise=sb.from('diary').select('*');
    const timeoutPromise=new Promise((_,r)=>setTimeout(()=>r(new Error('fetch timeout')),15000));
    const {data,error}=await Promise.race([fetchPromise,timeoutPromise]);
    if(!error&&data){
      // Shared diary: one row per date for the whole crew. Load every row keyed by
      // date regardless of which user last edited it — no per-user filtering.
      const serverDatesForUser=new Set();
      data.forEach(row=>{
        // Don't let a late-arriving fetch clobber a day the user is actively working
        // on: one they unlocked this session, or the past day they currently have open.
        const editingThis=row.date===editDate&&row.date<today&&diary[row.date]&&!isDayEmpty(diary[row.date]);
        if(unlockedThisSession.has(row.date)){
          if(diary[row.date])diary[row.date].locked=false;  // keep local, ensure unlocked
        }else if(!editingThis){
          diary[row.date]=row.data;      // server wins for dates present on both
        }                                 // else: keep local for the open day
        serverDatesForUser.add(row.date);
      });

      // Drop orphaned empty entries from local cache: dates that aren't on the server
      // and have no user content. These are stale shells from previous sessions (or
      // rows we just deleted server-side); they would otherwise re-render as ghost
      // $0 cards forever. Done regardless of `locked` flag — locked-empty is still empty.
      Object.keys(diary).forEach(d=>{
        if(!serverDatesForUser.has(d)&&isDayEmpty(diary[d])){
          delete diary[d];
        }
      });

      // Push any local-only dates (edits that never made it to Supabase in a previous session).
      // Skip empty records so opening the app doesn't create a ghost row in the cloud.
      const localOnly=Object.keys(localCache).filter(d=>!serverDatesForUser.has(d)&&!isDayEmpty(localCache[d]));
      if(localOnly.length&&currentUser?.id){
        const rows=localOnly.map(d=>({date:d,user_id:currentUser.id,data:{...localCache[d],_userEmail:currentUser.email}}));
        sb.from('diary').upsert(rows,{onConflict:'date'}).then(({error:syncErr})=>{
          if(syncErr)console.warn('Pending-sync error:',syncErr);
          else console.log('Pushed',localOnly.length,'pending day(s) from local cache to Supabase');
        });
      }

      try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}

      // Re-run migrations on server-merged data and re-render with the freshest state.
      Object.keys(diary).forEach(d=>migrateDayRecord(diary[d]));
      autoLockPastDays();
      renderToday();renderRec();renderSmry();
    }
  } catch(e){console.warn('Load error (will keep cached UI):',e.message||e);}
  // Pull the shared rate card so custom plant/personnel and rates resolve identically
  // for every user, then re-render costs with the merged rates.
  await _pullPlantConfig();
  renderToday();renderRec();renderSmry();
  if(el)el.classList.remove('show');
}

// Auto-lock every past day (date<today) that's currently unlocked. Runs on load.
// Days the user has explicitly unlocked this session are skipped so editing isn't
// undone mid-session; a fresh page load (new session) re-locks them as the safe default.
function autoLockPastDays(){
  if(!currentUser?.id)return;
  const rows=[];
  // Drop empty in-memory shells for past days so they never get persisted. These come
  // from renderToday() instantiating a default record just to render the form.
  Object.keys(diary).forEach(date=>{
    if(date<today && date!==editDate && diary[date] && !diary[date].locked && !unlockedThisSession.has(date) && isDayEmpty(diary[date])){
      delete diary[date];
    }
  });
  Object.keys(diary).forEach(date=>{
    // Never lock the day the user currently has open (editDate) or one they unlocked
    // this session — locking it would disable the form out from under them mid-edit.
    if(date<today && date!==editDate && diary[date] && !diary[date].locked && !unlockedThisSession.has(date)){
      diary[date].locked=true;
      rows.push({date,user_id:currentUser.id,data:{...diary[date],_userEmail:currentUser.email}});
    }
  });
  try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
  if(!rows.length)return;
  sb.from('diary').upsert(rows,{onConflict:'date'}).then(({error})=>{
    if(error)console.warn('Auto-lock sync error:',error);
    else console.log('Auto-locked',rows.length,'past day(s)');
  });
}

// ── Sync-error banner (sticky until the next successful save) ──────────────
let _lastFailedDate=null;
function showSyncBanner(date,msg){
  _lastFailedDate=date;
  const el=document.getElementById('sync-err-banner');if(!el)return;
  const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  el.innerHTML=`<span style="flex:1;min-width:200px">⚠ Couldn’t save ${fmtD(date)} to the cloud — ${esc(msg)}. Your changes are kept on this device; tap Retry to try syncing again.</span>`
    +`<button onclick="retrySync()" style="font-size:12px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--red);background:#fff;color:var(--red);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:600;min-height:36px">Retry</button>`;
  el.style.display='flex';
}
function clearSyncBanner(){
  _lastFailedDate=null;
  const el=document.getElementById('sync-err-banner');
  if(el){el.style.display='none';el.innerHTML='';}
}
async function retrySync(){
  if(!_lastFailedDate)return clearSyncBanner();
  const date=_lastFailedDate;
  if(!currentUser?.id){alert('Sign in to sync these changes.');return;}
  if(!diary[date]||isDayEmpty(diary[date])){clearSyncBanner();return;}
  const el=document.getElementById('sync-err-banner');
  if(el)el.style.opacity='0.6';
  try{
    const {error}=await sb.from('diary').upsert(
      {date,user_id:currentUser.id,data:{...diary[date],_userEmail:currentUser.email}},
      {onConflict:'date'}
    );
    if(error)showSyncBanner(date,error.message||'unknown error');
    else clearSyncBanner();
  }catch(e){showSyncBanner(date,e.message||'network error');}
  if(el)el.style.opacity='1';
}

// Backup flush when the tab is hidden/closed. The main save() path is no longer
// debounced, so this only matters for the rare case where the in-flight fetch
// would otherwise be killed by the browser on unload. Uses keepalive so the
// request survives page teardown.
function _pageHideFlush(){
  if(!currentUser?.id||!currentAccessToken)return;
  const d=editDate;
  if(!diary[d]||isDayEmpty(diary[d]))return;
  try{
    const body=JSON.stringify([{date:d,user_id:currentUser.id,data:{...diary[d],_userEmail:currentUser.email}}]);
    fetch(SUPA_URL+'/rest/v1/diary?on_conflict=date',{
      method:'POST',keepalive:true,
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+currentAccessToken,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body
    });
  }catch(e){}
}
window.addEventListener('pagehide',_pageHideFlush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)_pageHideFlush();});

// Persistence: every save() now writes localStorage synchronously AND fires the
// Supabase upsert immediately (no debounce). The previous 400 ms timer was the
// main reason discrete edits sometimes didn't reach the cloud — if the user
// navigated/closed within that window, the upsert never fired and the next
// session's server fetch reverted the local change.
function save(){
  const targetDate=editDate;
  try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
  const el=document.getElementById('sav-ind');
  if(el){el.textContent='Saving...';el.classList.add('show');}
  clearTimeout(saveT);saveT=null;
  if(!currentUser?.id){
    if(el){el.textContent='Local only — not signed in';setTimeout(()=>el.classList.remove('show'),1800);}
    renderRec();renderSmry();
    return;
  }
  // Don't auto-create a Supabase row for a day that has nothing in it yet.
  if(isDayEmpty(diary[targetDate])){
    if(el){el.textContent='';el.classList.remove('show');}
    renderRec();renderSmry();
    return;
  }
  sb.from('diary').upsert(
    {date:targetDate,user_id:currentUser.id,data:{...(diary[targetDate]||{}),_userEmail:currentUser.email}},
    {onConflict:'date'}
  ).then(({error})=>{
    if(error){
      console.warn('Supabase save error:',error);
      showSyncBanner(targetDate,error.message||'unknown error');
      if(el){el.textContent='Sync failed — '+(error.message||'unknown');setTimeout(()=>el.classList.remove('show'),3500);}
    } else {
      clearSyncBanner();
      if(el){el.textContent='Synced ✓';setTimeout(()=>el.classList.remove('show'),1500);}
    }
    renderRec();renderSmry();
  }).catch(e=>{
    console.warn('Supabase save exception:',e);
    showSyncBanner(targetDate,e.message||'network error');
    if(el){el.textContent='Save error';setTimeout(()=>el.classList.remove('show'),2500);}
    renderRec();renderSmry();
  });
}

function sw(tab,keepDate){
  ['today','rec','smry'].forEach(t=>{
    document.getElementById('nav-'+t).classList.toggle('on',t===tab);
    document.getElementById('p-'+t).style.display=t===tab?'block':'none';
  });

}

// ── Day data ─────────────────────────────────────
function day(date){
  if(!diary[date])diary[date]={weather:'',conditions:'',plant:[],personnel:[],workItems:[],powerlineItems:[],fuelL:0,standDown:false,notes:'',locked:false};
  return diary[date];
}
function calcCost(date){
  const d=diary[date]||{};
  if(d.standDown)return getStandDownRate()+(d.fuelL||0)*getFuelRate();
  let t=0;
  (d.plant||[]).forEach(p=>t+=getRate(p));
  (d.personnel||[]).forEach(p=>t+=getRate(p));
  (d.customPlant||[]).forEach(c=>t+=(plantConfig.plantOverrides[c.name]??c.rate??0));
  (d.customPers||[]).forEach(c=>t+=(plantConfig.persOverrides[c.name]??c.rate??0));
  t+=(d.fuelL||0)*getFuelRate();
  return t;
}

function money(n){return'$'+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtD(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y}`;}
function fmtDShort(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y.slice(2)}`;}
function wxLabel(k){return WX.find(w=>w.k===k)?.lbl||'Not recorded';}
function wxEmoji(k){return WX.find(w=>w.k===k)?.e||'🌤';}

// ── Lock / Unlock ────────────────────────────────
function lockDay(date){
  if(!confirm('Lock '+fmtD(date)+'?\n\nLocked days cannot be edited until unlocked.'))return;
  unlockedThisSession.delete(date);
  day(date).locked=true;
  // Save locked state directly
  const prev=editDate;editDate=date;save();editDate=prev;
  // The Today view is the active edit surface (the Edit Day modal is unused).
  // Refresh it whenever the day being (un)locked is the one currently open.
  if(editDate===date)renderToday();
  else renderEditModal(date);
  renderRec();
}
function unlockDay(date){
  if(!confirm('Unlock '+fmtD(date)+' for editing?'))return;
  unlockedThisSession.add(date);
  day(date).locked=false;
  const prev=editDate;editDate=date;save();editDate=prev;
  if(editDate===date)renderToday();
  else renderEditModal(date);
  renderRec();
}
async function deleteDay(date){
  const d=diary[date];
  if(!d||isDayEmpty(d))return;
  if(d.locked){alert('This day is locked. Unlock it first, then delete.');return;}
  if(!confirm('Delete the day sheet for '+fmtD(date)+'?\n\nThis permanently removes it from records on every device and cannot be undone.'))return;
  delete diary[date];
  unlockedThisSession.delete(date);
  try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
  if(currentUser?.id){
    try{
      const {error}=await sb.from('diary').delete().eq('date',date).eq('user_id',currentUser.id);
      if(error){console.warn('Delete sync error:',error);alert('Removed on this device, but cloud delete failed: '+(error.message||'unknown')+'\nIt may reappear after a refresh — try again when back online.');}
    }catch(e){console.warn('Delete exception:',e);alert('Removed on this device, but cloud delete failed: '+(e.message||e));}
  }
  if(editDate===date)editDate=today;
  renderToday();renderRec();renderSmry();
  sw('rec');
}

function saveRates(){

  allPersItems().forEach(function(p,i){const v=parseFloat(document.getElementById('per-'+i)?.value)||0;if(p.builtin){if(v!==PERS_RATES[p.name])plantConfig.persOverrides[p.name]=v;else delete plantConfig.persOverrides[p.name];}else{const c=plantConfig.customPers.find(c=>c.name===p.name);if(c)c.rate=v;}});
  const fr=parseFloat(document.getElementById('fuel-r-inp')?.value);if(!isNaN(fr)&&fr>=0)plantConfig.fuelRate=fr;

function removePersItem(name,builtin){if(builtin){if(!plantConfig.removedPers.includes(name))plantConfig.removedPers.push(name);}else{plantConfig.customPers=plantConfig.customPers.filter(c=>c.name!==name);}savePlantConfig();renderRatesManager();renderOnSite();}

// ── Summary tab ──────────────────────────────────
function renderSmry(){
  const el=document.getElementById('p-smry');if(!el)return;
  const allDates=Object.keys(diary).sort();
  const totalCost=allDates.reduce(function(a,d){return a+calcCost(d);},0);
  const daysOn=allDates.filter(function(d){return(diary[d].plant||[]).length||(diary[d].personnel||[]).length||diary[d].standDown;}).length;
  const sdDays=allDates.filter(function(d){return diary[d].standDown;}).length;
  var totalWI=0,doneWI=0,grpSum={},plTotal=0,plDone=0;
  allDates.forEach(function(dt){
    (diary[dt].workItems||[]).forEach(function(w){totalWI++;if(w.done)doneWI++;if(!grpSum[w.group])grpSum[w.group]={total:0,done:0};grpSum[w.group].total++;if(w.done)grpSum[w.group].done++;});
    (diary[dt].powerlineItems||[]).forEach(function(w){plTotal++;if(w.done)plDone++;});
  });
  var plantTotals={};
  allDates.forEach(function(date){
    var d=diary[date]||{};if(d.standDown)return;
    (d.plant||[]).forEach(function(p){plantTotals[p]=(plantTotals[p]||0)+getRate(p);});
    (d.personnel||[]).forEach(function(p){plantTotals[p]=(plantTotals[p]||0)+getRate(p);});
    // Custom items: use the per-day stored rate (with override fallback) so summary matches the day total
    (d.customPlant||[]).forEach(function(c){var r=plantConfig.plantOverrides[c.name]??c.rate??getRate(c.name);plantTotals[c.name]=(plantTotals[c.name]||0)+r;});
    (d.customPers||[]).forEach(function(c){var r=plantConfig.persOverrides[c.name]??c.rate??getRate(c.name);plantTotals[c.name]=(plantTotals[c.name]||0)+r;});
  });
  var byMonth={};allDates.forEach(function(date){var k=date.slice(0,7);if(!byMonth[k])byMonth[k]=[];byMonth[k].push(date);});
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var html='';
  html+='<div class="page-title">Summary</div><div class="page-sub">Clarke Creek Wind Farm</div>';
  html+='<div class="smry-grid">';
  html+='<div class="smry-card"><div class="smry-num">'+money(totalCost)+'</div><div class="smry-lbl">All time (ex GST)</div></div>';
  html+='<div class="smry-card"><div class="smry-num">'+daysOn+(sdDays?'<div style="font-size:12px;margin-top:2px">'+sdDays+' stand down</div>':'')+'</div><div class="smry-lbl">Days on site</div></div>';
  html+='</div>';

function setPreset(p){var now=new Date();var from,to=today;if(p==='tw'){var d=new Date(now);d.setDate(d.getDate()-d.getDay()+1);from=localDateStr(d);}else if(p==='lw'){var d=new Date(now);d.setDate(d.getDate()-d.getDay()-6);from=localDateStr(d);var e=new Date(now);e.setDate(e.getDate()-e.getDay());to=localDateStr(e);}else if(p==='tm'){from=today.slice(0,7)+'-01';}else if(p==='lm'){var d=new Date(now.getFullYear(),now.getMonth()-1,1);from=localDateStr(d);var e=new Date(now.getFullYear(),now.getMonth(),0);to=localDateStr(e);}else{var d=Object.keys(diary).sort();from=d[0]||today;}var fi=document.getElementById('range-from');var ti=document.getElementById('range-to');if(fi)fi.value=from;if(ti)ti.value=to;updateRangeTotal();}
function updateRangeTotal(){var from=document.getElementById('range-from')?.value;var to=document.getElementById('range-to')?.value;if(!from||!to)return;var dates=Object.keys(diary).filter(function(d){return d>=from&&d<=to;});var t=dates.reduce(function(a,d){return a+calcCost(d);},0);var el=document.getElementById('range-total');var dl=document.getElementById('range-days-label');if(el)el.textContent=money(t);if(dl)dl.textContent=dates.length+' day'+(dates.length!==1?'s':'')+' in range';}

function calcCostFromRecord(d){
  if(!d)return 0;
  if(d.standDown)return getStandDownRate()+(d.fuelL||0)*getFuelRate();
  let t=0;
  (d.plant||[]).forEach(p=>t+=getRate(p));
  (d.personnel||[]).forEach(p=>t+=getRate(p));
  (d.customPlant||[]).forEach(c=>t+=(plantConfig.plantOverrides[c.name]??c.rate??0));
  (d.customPers||[]).forEach(c=>t+=(plantConfig.persOverrides[c.name]??c.rate??0));
  t+=(d.fuelL||0)*getFuelRate();
  return t;
}

function getAllScopeItems(){
  const items=COLLECTOR_GROUPS.map((g,i)=>({id:'cg_'+i,label:g,sec:'Collector Groups',custom:false}));
  const seen=new Set(items.map(i=>i.id));
  const addFrom=src=>{
    Object.keys(src).forEach(date=>{
      (src[date]?.customScope||[]).forEach(c=>{
        if(c&&c.id&&!seen.has(c.id)){
          items.push({id:c.id,label:c.label||'(no label)',sec:c.section||'Custom items',custom:true});
          seen.add(c.id);
        }
      });
    });
  };
  addFrom(diary);
  if(isAdmin())Object.values(allUsersDiary).forEach(u=>addFrom(u.records||{}));
  return items;
}

function getPhotosForScope(scopeId){
  const out=[];
  const walk=(src,owner)=>{
    Object.keys(src).forEach(date=>{
      const sp=src[date]?.scopePhotos;
      if(sp&&sp[scopeId])sp[scopeId].forEach(p=>out.push({...p,date,owner}));
    });
  };
  walk(diary,null);
  if(isAdmin())Object.values(allUsersDiary).forEach(u=>walk(u.records||{},u.email));
  return out;
}

async function resizeImage(file,maxDim=2000,quality=0.85){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result;};
    reader.onerror=reject;
    img.onload=()=>{
      const ratio=Math.min(maxDim/img.width,maxDim/img.height,1);
      const w=Math.max(1,Math.round(img.width*ratio));
      const h=Math.max(1,Math.round(img.height*ratio));
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob){reject(new Error('Resize failed'));return;}
        resolve(blob);
      },'image/jpeg',quality);
    };
    img.onerror=()=>reject(new Error('Could not read image'));
    reader.readAsDataURL(file);
  });
}

async function getSignedUrl(path){
  const cached=_signedUrlCache.get(path);
  if(cached&&cached.expires>Date.now())return cached.url;
  try{
    const {data,error}=await sb.storage.from('diary-photos').createSignedUrl(path,3600);
    if(error){console.warn('Signed URL error:',error);return null;}
    _signedUrlCache.set(path,{url:data.signedUrl,expires:Date.now()+50*60*1000});
    return data.signedUrl;
  }catch(e){console.warn('Signed URL exception:',e);return null;}
}

async function uploadPhoto(file,scopeId){
  if(!currentUser?.id){alert('Not signed in');return null;}
  const overlay=document.getElementById('upload-overlay');
  const msg=document.getElementById('upload-msg');
  if(overlay){overlay.classList.add('open');msg.textContent='Preparing '+file.name+'…';}
  try{
    const blob=await resizeImage(file);
    if(msg)msg.textContent='Uploading '+file.name+'…';
    const uid=currentUser.id;
    const date=editDate||today;
    const filename=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
    const path=uid+'/'+date+'/'+filename;
    const {error}=await sb.storage.from('diary-photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'3600'});
    if(error)throw error;
    if(!diary[date])day(date);
    if(!diary[date].scopePhotos)diary[date].scopePhotos={};
    if(!diary[date].scopePhotos[scopeId])diary[date].scopePhotos[scopeId]=[];
    const rec={path,name:file.name,caption:'',uploaded_at:new Date().toISOString()};
    diary[date].scopePhotos[scopeId].push(rec);
    const prev=editDate;editDate=date;save();editDate=prev;
    return rec;
  }catch(e){
    console.error('Upload failed:',e);
    alert('Upload failed: '+(e.message||e));
    return null;
  }finally{
    if(overlay)overlay.classList.remove('open');
  }
}

async function handlePhotoUpload(event){
  const files=Array.from(event.target.files||[]);
  event.target.value='';
  if(!files.length||!currentPhotoScopeId)return;
  for(const file of files){
    if(!file.type.startsWith('image/')){console.warn('Skip non-image:',file.name);continue;}
    await uploadPhoto(file,currentPhotoScopeId);
  }
  await renderPhotoGrid();
  renderSmry();
}

  body.innerHTML='<div class="photo-grid">'+photos.map(p=>{

  const path=decodeURIComponent(encPath);
  const touched=new Set();
  Object.keys(diary).forEach(date=>{

    if(!sp)return;
    Object.keys(sp).forEach(sid=>{
      sp[sid].forEach(p=>{if(p.path===path&&p.caption!==caption){p.caption=caption;touched.add(date);}});

async function deletePhoto(encPath){
  const path=decodeURIComponent(encPath);
  if(!confirm('Delete this photo? This cannot be undone.'))return;
  try{
    const {error}=await sb.storage.from('diary-photos').remove([path]);
    if(error)console.warn('Storage delete error:',error);
  }catch(e){console.warn('Storage delete exception:',e);}
  _signedUrlCache.delete(path);
  const touched=new Set();
  Object.keys(diary).forEach(date=>{
    const sp=diary[date]?.scopePhotos;
    if(!sp)return;
    Object.keys(sp).forEach(sid=>{
      const before=sp[sid].length;
      sp[sid]=sp[sid].filter(p=>p.path!==path);
      if(sp[sid].length!==before)touched.add(date);
    });

  renderSmry();

// ── Export / Import ──────────────────────────────
function exportData(){
  const data={diary:diary,exported:new Date().toISOString(),version:'ccwf_v1'};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='CCWF_Diary_Backup_'+today+'.json';a.click();URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.diary)throw new Error('Invalid backup file');
      const count=Object.keys(data.diary).length;
      if(!confirm('Import '+count+' day record(s) from backup?\n\nExisting days will be overwritten if there is a conflict.'))return;
      diary={...diary,...data.diary};
      localStorage.setItem(KEY,JSON.stringify(diary));
      try{
        if(currentUser?.id){
          const rows=Object.entries(diary).map(([date,d])=>({date,user_id:currentUser.id,data:{...d,_userEmail:currentUser.email}}));
          const {error}=await sb.from('diary').upsert(rows,{onConflict:'date'});
          if(error)console.warn('Import sync error:',error);
        }
      }catch(e){console.warn('Import sync error:',e);}
      renderToday();renderRec();renderSmry();
      alert('Import successful — '+count+' records loaded and synced.');
    }catch(err){alert('Import failed: '+err.message);}
    event.target.value='';
  };
  reader.readAsText(file);
}

// ── PDF generation ───────────────────────────────
// Fetch and embed-encode all photos for a given day. Returned bundles are ready
// to drop into a jsPDF doc as base64 data URLs.
async function _fetchPhotoBundles(date,d){
  const bundles=[];
  if(!d.scopePhotos)return bundles;
  const scopeLookup={};
  (d.workItems||[]).forEach(function(w,wi){scopeLookup['wi_'+date+'_'+wi]={label:w.group+(w.detail?' — '+w.detail:''),sec:'Works'};});
  (d.powerlineItems||[]).forEach(function(w,wi){scopeLookup['pl_'+date+'_'+wi]={label:'Powerline — '+w.detail,sec:'Powerline Access Track'};});
  (d.customScope||[]).forEach(c=>{scopeLookup[c.id]={label:c.label,sec:c.section||'Custom items'};});
  for(const [sid,arr] of Object.entries(d.scopePhotos)){
    if(!arr||!arr.length)continue;
    const info=scopeLookup[sid]||{label:'(unknown scope)',sec:''};
    const photos=[];
    for(const p of arr){
      try{
        const url=await getSignedUrl(p.path);
        if(!url)continue;
        const res=await fetch(url);
        if(!res.ok)continue;
        const blob=await res.blob();
        const dataUrl=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(blob);});
        photos.push({...p,dataUrl});
      }catch(e){console.warn('Photo fetch error:',p.path,e);}
    }
    if(photos.length)bundles.push({label:info.label,section:info.sec,photos});
  }
  return bundles;
}

// ── Day sheet PDF data round-trip ────────────────
// Embed the day record(s) as a base64 JSON payload in the PDF's /Info Keywords
// field. It's invisible in the document but lets us re-import the exact data
// later. jsPDF writes /Info as plain (uncompressed) text, so import can read it
// straight from the file bytes — no PDF library needed.
const PDF_PAYLOAD_TAG='CCWFDIARYv1:';
// Build the base64 import payload for the given dates. Custom plant/personnel that were
// selected into the plant/personnel arrays carry no rate (rates live in per-device config),
// so fold them into customPlant/customPers with their resolved rate — that way an import
// reproduces the printed sheet exactly on any device.
function _buildPayloadB64(dates){
  const days={};
  (dates||[]).forEach(dt=>{
    const rec=diary[dt];
    if(!rec)return;
    const clean={...rec};
    delete clean._userEmail;
    const plantArr=[],persArr=[];
    const custPlant=[...(clean.customPlant||[])],custPers=[...(clean.customPers||[])];
    (clean.plant||[]).forEach(n=>{ if(PLANT_RATES[n]!=null)plantArr.push(n); else custPlant.push({name:n,rate:getRate(n)}); });
    (clean.personnel||[]).forEach(n=>{ if(PERS_RATES[n]!=null)persArr.push(n); else custPers.push({name:n,rate:getRate(n)}); });
    clean.plant=plantArr;clean.personnel=persArr;clean.customPlant=custPlant;clean.customPers=custPers;
    days[dt]=clean;
  });
  const json=JSON.stringify({v:1,app:'ccwf-diary',days});
  return btoa(unescape(encodeURIComponent(json)));
}
// Also write the payload into PDF metadata (kept for backward compatibility with importers
// that only scan /Info). The primary, reliable carrier is the appended marker below.
function _embedDiaryPayload(doc,dates){
  try{ doc.setProperties({title:'CCWF Day Sheet',creator:'CCWF Civil Works Site Diary',keywords:PDF_PAYLOAD_TAG+_buildPayloadB64(dates)}); }
  catch(e){console.warn('Embed payload (metadata) failed:',e);}
}
// Download the PDF with the payload appended after the final %%EOF as a comment line.
// jsPDF's metadata round-trip proved unreliable in some browsers; bytes appended after
// %%EOF are ignored by PDF readers but are trivially recoverable by a raw byte scan, so
// this is the dependable import carrier.
function _downloadPdfWithPayload(doc,dates,filename){
  let bytes;
  try{ bytes=new Uint8Array(doc.output('arraybuffer')); }
  catch(e){ console.warn('PDF output failed, using doc.save():',e); doc.save(filename); return; }
  try{
    const b64=_buildPayloadB64(dates);
    if(b64){
      const marker='\n%'+PDF_PAYLOAD_TAG+b64+'\n';
      const mb=new Uint8Array(marker.length);
      for(let i=0;i<marker.length;i++)mb[i]=marker.charCodeAt(i)&0xff;
      const merged=new Uint8Array(bytes.length+mb.length);
      merged.set(bytes,0);merged.set(mb,bytes.length);
      bytes=merged;
    }
  }catch(e){console.warn('Payload append failed:',e);}
  try{
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){console.warn('Blob download failed, using doc.save():',e);doc.save(filename);}
}

function triggerImportPDF(){const i=document.getElementById('pdf-import-input');if(i)i.click();}
function handleImportPDFInput(e){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importDaySheetPDF(f);}

async function importDaySheetPDF(file){
  if(!file)return;
  // 1) Preferred path: structured data embedded in the PDF (new sheets). The payload is
  // carried both as an appended %%EOF-comment (reliable) and in /Info metadata (legacy).
  // Scan for every copy and try the LAST one first (the appended marker), since a stale
  // or mangled metadata copy can appear earlier in the file.
  let payload=null,_dbg='no embedded payload tag found';
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    const txt=new TextDecoder('latin1').decode(buf);
    const re=new RegExp(PDF_PAYLOAD_TAG+'([A-Za-z0-9+/=]+)','g');
    const cands=[];let mm;
    while((mm=re.exec(txt))!==null)cands.push(mm[1]);
    if(cands.length){
      _dbg=cands.length+' payload tag(s) found, but none decoded';
      for(let i=cands.length-1;i>=0;i--){
        try{
          const json=decodeURIComponent(escape(atob(cands[i])));
          const p=JSON.parse(json);
          if(p&&p.days&&typeof p.days==='object'&&Object.keys(p.days).length){payload=p;break;}
        }catch(e){_dbg=cands.length+' payload tag(s) found; decode error: '+(e.message||e);}
      }
    }
  }catch(e){_dbg='read error: '+(e.message||e);}
  if(payload&&payload.days&&typeof payload.days==='object'&&Object.keys(payload.days).length){
    _confirmAndApplyImport(payload.days);
    return;
  }
  console.warn('Embedded payload not used →',_dbg,'; falling back to text-scrape.');
  // 2) Fallback: read the printed text off an older app-generated sheet.
  let sheets=null;
  try{sheets=await _scrapeDaySheetPDF(file);}catch(e){console.warn('PDF scrape error:',e);}
  if(!sheets||!sheets.length){
    alert('This PDF doesn’t contain importable diary data.\n\nIt needs to be a Civil Works day sheet generated by this app. If it is one and this keeps failing, ask the sender to re-download it from the updated app.');
    return;
  }
  const days={};const warns=new Set();const lines=[];
  const fmt=dt=>{try{return fmtD(dt);}catch(e){return dt;}};
  sheets.forEach(s=>{
    days[s.date]=s.rec;
    const c=_recCost(s.rec);
    let line='• '+fmt(s.date)+' — '+(s.rec.standDown?'Stand down, ':'')+wxLabel(s.rec.weather)+', '+
      (s.rec.plant||[]).length+' plant, '+(s.rec.personnel||[]).length+' personnel, '+
      (s.rec.workItems||[]).length+' works, total '+money(c);
    lines.push(line);
    if(s.shownTotal!=null&&Math.abs(s.shownTotal-c)>0.01)
      warns.add('Rebuilt total differs from the printed total on at least one day (custom plant/personnel aren’t shown on the sheet, so they can’t be recovered). Check the day after importing.');
  });
  warns.add('Site conditions and photos can’t be recovered from an older PDF — add them manually if needed.');
  const preface='This PDF has no embedded data, so it was read from the printed sheet. Check it matches before saving:\n\n'+
    lines.join('\n')+'\n\n'+Array.from(warns).map(w=>'⚠ '+w).join('\n');
  _confirmAndApplyImport(days,{preface});
}

// Shared writer: confirm (with conflict/overwrite summary), then persist + sync + render.
function _confirmAndApplyImport(daysObj,opts){
  const dates=Object.keys(daysObj).sort();
  if(!dates.length){alert('No day data found in this PDF.');return;}
  const fmt=dt=>{try{return fmtD(dt);}catch(e){return dt;}};
  const conflicts=dates.filter(dt=>diary[dt]&&!isDayEmpty(diary[dt]));
  let msg=(opts&&opts.preface)?opts.preface+'\n\n':'';
  msg+=conflicts.length
    ?'This will OVERWRITE existing data for:\n'+conflicts.map(fmt).join('\n')+'\n\nImport '+dates.length+' day'+(dates.length!==1?'s':'')+'?'
    :'Import '+dates.length+' day'+(dates.length!==1?'s':'')+' from this PDF?\n\n'+dates.map(fmt).join('\n');
  if(!confirm(msg))return;
  dates.forEach(dt=>{
    const rec={...daysObj[dt]};
    delete rec._userEmail;
    diary[dt]=rec;
    migrateDayRecord(diary[dt]);
  });
  try{localStorage.setItem(KEY,JSON.stringify(diary));}catch(e){}
  if(currentUser?.id){
    const rows=dates.filter(dt=>!isDayEmpty(diary[dt])).map(dt=>({date:dt,user_id:currentUser.id,data:{...diary[dt],_userEmail:currentUser.email}}));
    if(rows.length){
      sb.from('diary').upsert(rows,{onConflict:'date'}).then(({error})=>{
        if(error){console.warn('Import sync error:',error);alert('Imported on this device, but cloud sync failed: '+(error.message||'unknown')+'\nIt will retry next time you open the app.');}
      });
    }
  }else{
    alert('Imported on this device. Sign in to sync these day(s) to the cloud.');
  }
  if(dates.length===1)editDate=dates[0];
  renderToday();renderRec();renderSmry();
  sw('rec');
  alert('Imported '+dates.length+' day'+(dates.length!==1?'s':'')+' successfully.\nOpen a day to view or download its sheet.');
}

// ── Text-scrape fallback for older PDFs (no embedded payload) ──────────
function _ensurePdfWorker(){
  if(window._pdfWorkerReady||!window.pdfjsLib)return;
  const wsrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try{
    const blob=new Blob(["importScripts('"+wsrc+"');"],{type:'application/javascript'});
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(blob);
  }catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=wsrc;}
  window._pdfWorkerReady=true;
}
function _recCost(rec){
  if(rec.standDown)return getStandDownRate()+(rec.fuelL||0)*getFuelRate();
  let t=0;
  (rec.plant||[]).forEach(p=>t+=getRate(p));
  (rec.personnel||[]).forEach(p=>t+=getRate(p));
  (rec.customPlant||[]).forEach(c=>t+=(c.rate||0));
  (rec.customPers||[]).forEach(c=>t+=(c.rate||0));
  t+=(rec.fuelL||0)*getFuelRate();
  return t;
}
const _GROUP_LOOKUP=(()=>{const m={};[...COLLECTOR_GROUPS,'Track Rectification'].forEach(g=>{m[g.toUpperCase()]=g;});return m;})();
function _restoreWorkGroup(up){
  if(!up)return'';
  if(_GROUP_LOOKUP[up])return _GROUP_LOOKUP[up];
  return up.replace(/\w\S*/g,w=>w.charAt(0)+w.slice(1).toLowerCase());
}
async function _scrapeDaySheetPDF(file){
  if(!window.pdfjsLib)return null;
  _ensurePdfWorker();
  let pdf;
  try{
    const buf=await file.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }catch(e){console.warn('pdf.js load error:',e);return null;}
  const items=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    tc.items.forEach(it=>{
      const s=it.str||'';
      if(!s.trim())return;
      const tr=it.transform;
      items.push({page:p,x:tr[4],y:tr[5],str:s});
    });
  }
  // Reproduce render order: page, then top-to-bottom (y desc), then left-to-right (x asc).
  items.sort((a,b)=>{
    if(a.page!==b.page)return a.page-b.page;
    if(Math.abs(a.y-b.y)>1.5)return b.y-a.y;
    return a.x-b.x;
  });
  const toks=items.map(i=>i.str.trim()).filter(Boolean);
  const headerIdxs=[];
  toks.forEach((t,k)=>{if(/^CIVIL WORKS DAY SHEET$/i.test(t))headerIdxs.push(k);});
  if(!headerIdxs.length)return null;
  const sheets=[];
  for(let h=0;h<headerIdxs.length;h++){
    const start=headerIdxs[h];
    const end=h+1<headerIdxs.length?headerIdxs[h+1]:toks.length;
    const parsed=_parseOneSheet(toks.slice(start,end));
    if(parsed&&parsed.date)sheets.push(parsed);
  }
  return sheets;
}
function _parseOneSheet(toks){
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad=n=>String(n).padStart(2,'0');
  const rec={weather:'',conditions:'',plant:[],personnel:[],workItems:[],powerlineItems:[],customPlant:[],customPers:[],fuelL:0,standDown:false,notes:'',locked:false};
  let date=null;
  for(const t of toks){
    const m=t.match(/^(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{2})$/);
    if(m){date=`20${m[3]}-${pad(MN.indexOf(m[2])+1)}-${pad(m[1])}`;break;}
  }
  for(const t of toks){
    const m=t.match(/^Weather:\s*(.+)$/);
    if(m){const w=WX.find(x=>x.lbl===m[1].trim());rec.weather=w?w.k:'';break;}
  }
  const findFrom=(re,from)=>{for(let k=(from||0);k<toks.length;k++)if(re.test(toks[k]))return k;return -1;};
  const iPlant=findFrom(/^PLANT & PERSONNEL ON SITE$/i,0);
  const iAmount=findFrom(/^AMOUNT$/i,iPlant<0?0:iPlant);
  const iWorks=findFrom(/^WORKS UNDERTAKEN$/i,0);
  const iNotes=findFrom(/^NOTES$/i,iWorks<0?0:iWorks);
  const iTotal=findFrom(/^DAY TOTAL/i,0);
  // Plant & personnel rows. Tolerant of pdf.js splitting a row's rate/amount into
  // several tokens: any "$…"/"…/day" token is a value; a name ends at its first value.
  if(iAmount>=0){
    const sub=findFrom(/^Subtotal$/i,iAmount);
    const end=sub>=0?sub:(iWorks>=0?iWorks:toks.length);
    const isVal=t=>/\$[\d,]+\.\d{2}/.test(t)||/^\/?day$/i.test(t);
    const moneyVal=t=>{const m=t.match(/\$([\d,]+\.\d{2})/);return m?parseFloat(m[1].replace(/,/g,'')):null;};
    let nameBuf=[],rowRate=null;
    const finalize=()=>{
      const name=nameBuf.join(' ').replace(/\s+/g,' ').trim();nameBuf=[];
      if(name){
        if(PLANT_RATES[name]!=null)rec.plant.push(name);
        else if(PERS_RATES[name]!=null)rec.personnel.push(name);
        else rec.customPlant.push({name,rate:rowRate||0});
      }
      rowRate=null;
    };
    for(let k=iAmount+1;k<end;k++){
      const t=toks[k];
      if(/^Subtotal$/i.test(t))break;
      if(/Stand down/i.test(t)){if(nameBuf.length)finalize();rec.standDown=true;continue;}
      const fm=t.match(/^Fuel\s*\(\s*(\d+(?:\.\d+)?)\s*L/i);
      if(fm){if(nameBuf.length)finalize();rec.fuelL=parseFloat(fm[1]);continue;}
      if(/^No plant/i.test(t)){nameBuf=[];continue;}
      if(isVal(t)){
        if(nameBuf.length){if(rowRate==null)rowRate=moneyVal(t);finalize();}
        continue;
      }
      nameBuf.push(t);
    }
    if(nameBuf.length)finalize();
  }
  // Works undertaken. Tolerant of a split "IN PROGRESS" status token.
  if(iWorks>=0){
    const end=iNotes>iWorks?iNotes:(iTotal>iWorks?iTotal:toks.length);
    let mode='work',buf=[];
    const close=done=>{
      if(mode==='work'){
        const group=buf.length?buf[0]:'';
        rec.workItems.push({group:_restoreWorkGroup(group),detail:buf.slice(1).join(' ').trim(),done,id:'imp_'+date+'_w'+rec.workItems.length});
      }else{
        rec.powerlineItems.push({detail:buf.join(' ').trim(),done,id:'imp_'+date+'_p'+rec.powerlineItems.length});
      }
      buf=[];
    };
    for(let k=iWorks+1;k<end;k++){
      const t=toks[k];
      if(/^No works recorded\.?$/i.test(t)){buf=[];continue;}
      if(/^Powerline Access Track$/i.test(t)){buf=[];mode='pl';continue;}
      let done=null;
      if(/^COMPLETED$/i.test(t))done=true;
      else if(/^IN PROGRESS$/i.test(t))done=false;
      else if(/^IN$/i.test(t)&&/^PROGRESS$/i.test(toks[k+1]||'')){done=false;k++;}
      if(done!==null){close(done);continue;}
      buf.push(t);
    }
  }
  // Notes
  if(iNotes>=0){
    const end=iTotal>iNotes?iTotal:toks.length;
    rec.notes=toks.slice(iNotes+1,end).join(' ').replace(/\s+/g,' ').trim();
  }
  // Printed day total (for cross-check)
  let shownTotal=null;
  if(iTotal>=0){const tv=toks[iTotal+1]||'';const m=tv.match(/\$([\d,]+\.\d{2})/);if(m)shownTotal=parseFloat(m[1].replace(/,/g,''));}
  return{date,rec,shownTotal};
}

// Single-day PDF: used by the Day Sheet modal's Download PDF button.
async function generatePDF(){
  const btn=document.getElementById('pdf-btn');
  if(btn){btn.textContent='Generating...';btn.disabled=true;}
  try{
    const date=currentSheetDate;
    const d=diary[date]||{};
    if(btn)btn.textContent='Fetching photos...';
    const photoBundles=await _fetchPhotoBundles(date,d);
    if(btn)btn.textContent='Generating...';
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    _renderDaySheetToDoc(doc,date,photoBundles);
    _embedDiaryPayload(doc,[date]);
    _downloadPdfWithPayload(doc,[date],`CCWF_Day_Sheet_${date}.pdf`);
  }catch(err){console.error(err);alert('PDF generation failed: '+err.message);}
  if(btn){btn.textContent='⬇ Download PDF';btn.disabled=false;}
}

// Range PDF: combine all day sheets between the From/To inputs on the Summary
// page into one downloadable document.
async function generateRangePDF(){
  const btn=document.getElementById('range-pdf-btn');
  const fromEl=document.getElementById('range-from');
  const toEl=document.getElementById('range-to');
  if(!fromEl||!toEl){alert('Range inputs not found.');return;}
  const from=fromEl.value,to=toEl.value;
  if(!from||!to){alert('Please pick a From and To date.');return;}
  if(from>to){alert('From date must be on or before To date.');return;}
  const dates=Object.keys(diary).filter(d=>d>=from&&d<=to).sort();
  if(!dates.length){alert('No day sheets found in this range.');return;}
  if(btn){btn.textContent='Generating...';btn.disabled=true;}
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    let first=true;
    for(const date of dates){
      if(btn)btn.textContent=`Day ${dates.indexOf(date)+1}/${dates.length}...`;
      if(!first)doc.addPage();
      first=false;
      const d=diary[date]||{};
      const photoBundles=await _fetchPhotoBundles(date,d);
      _renderDaySheetToDoc(doc,date,photoBundles);
    }
    _embedDiaryPayload(doc,dates);
    _downloadPdfWithPayload(doc,dates,`CCWF_Day_Sheets_${from}_to_${to}.pdf`);
  }catch(err){console.error(err);alert('Range PDF generation failed: '+err.message);}
  if(btn){btn.textContent='⬇ Download range PDF';btn.disabled=false;}
}

// Bug D fix: detect date rollover (e.g. tab left open past midnight) — uses LOCAL time
setInterval(()=>{
  const now=localDateStr();
  if(now===today)return;
  console.log('Date rolled over from',today,'to',now);
  const wasOnToday=editDate===today;
  today=now;
  if(wasOnToday)editDate=today;
  const sd=document.getElementById('sidebar-date');if(sd)sd.textContent=fmtD(today);
  if(document.getElementById('nav-today')?.classList.contains('on'))renderToday();
  renderRec();renderSmry();
},60000);

// Bug E fix: cross-tab sync — when another tab updates localStorage, merge into this tab's diary
window.addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{
    const updated=JSON.parse(e.newValue);
    if(!updated||typeof updated!=='object')return;
    diary={...diary,...updated};
    if(document.getElementById('nav-today')?.classList.contains('on'))renderToday();
    if(document.getElementById('nav-rec')?.classList.contains('on'))renderRec();
    if(document.getElementById('nav-smry')?.classList.contains('on'))renderSmry();
  }catch(err){console.warn('Cross-tab sync error:',err);}
});
